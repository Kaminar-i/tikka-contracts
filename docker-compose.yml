services:
  oracle:
    build: ./oracle
    env_file: .env
    restart: unless-stopped

    # Resource limits enforced by `docker compose up` (Compose V2 service-level keys).
    # Note: `deploy.resources` is a Swarm-only construct and is not enforced by
    # `docker compose up`; these service-level equivalents are used instead.
    mem_limit: 512M
    memswap_limit: 512M
    cpus: "1"

    # Data persistence: ledger checkpoint and deduplication store
    volumes:
      - oracle_data:/app/data

    # Health is published only on host loopback. Metrics stay on the internal
    # container network and are not published to the host.
    ports:
      - "127.0.0.1:${HEALTH_PORT:-9090}:${HEALTH_PORT:-9090}"
    expose:
      - "${METRICS_PORT:-9091}"
    
    # Log rotation to prevent unbounded log growth
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        labels: "service=oracle"
    
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:$${HEALTH_PORT:-9090}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  oracle_data:
    driver: local
